<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="About me: I build small, sharp tools for the friction I hit every day. Now building AgentGate, a Rust gateway that decides which AI agent may call which MCP tool. Learning more Rust, poking at Bitcoin, cryptography and wallets. Terminal ricer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#0e1733"/>
    </linearGradient>
    <style>
      text { font-family: "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, Menlo, monospace; font-size: 19px; }
      .p  { fill: #34d399; } .c { fill: #94a3b8; } .h { fill: #60a5fa; }
      .cmd { fill: #f1f5f9; }
      .out { fill: #cbd5e1; }
      .k1 { fill: #fbbf24; } .k2 { fill: #f87171; } .k3 { fill: #e879f9; } .k4 { fill: #22d3ee; } .k5 { fill: #34d399; }
      .dim { fill: #64748b; }
      .dir { fill: #60a5fa; font-weight: 700; }
      .type { clip-path: inset(0 100% 0 0); animation: type var(--d, 1s) steps(var(--n, 20)) var(--t, 0s) forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0) } }
      .show { opacity: 0; animation: show .35s ease-out var(--t, 0s) forwards; }
      @keyframes show { from { opacity: 0; transform: translateX(-6px) } to { opacity: 1; transform: none } }
      .cursor { opacity: 0; animation: show .1s linear var(--t) forwards, blink 1s step-end calc(var(--t) + .1s) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="#1f2a4d"/>

  <!-- title bar -->
  <rect x="1" y="1" width="1198" height="44" rx="19" fill="#111831"/>
  <rect x="1" y="26" width="1198" height="19" fill="#111831"/>
  <circle cx="30" cy="23" r="7" fill="#f87171"/>
  <circle cx="54" cy="23" r="7" fill="#fbbf24"/>
  <circle cx="78" cy="23" r="7" fill="#34d399"/>
  <text x="600" y="29" text-anchor="middle" class="dim" style="font-size:15px">root@luffy: ~/about</text>

  <g transform="translate(36 92)">
    <!-- $ cat about.md -->
    <text><tspan class="p">root@luffy</tspan><tspan class="c">:</tspan><tspan class="h">~</tspan><tspan class="c">$ </tspan></text>
    <text x="166" class="cmd type" style="--t:.5s;--d:.8s;--n:12">cat about.md</text>

    <text y="40"  class="out show" style="--t:1.5s"><tspan class="k1">▸</tspan> I build <tspan class="k1">small, sharp tools</tspan> for the friction I hit every day, then open-source them.</text>
    <text y="72"  class="out show" style="--t:1.9s"><tspan class="k5">▸</tspan> Now building <tspan class="k5">AgentGate</tspan>: a Rust gateway that decides which AI agent may call which MCP tool.</text>
    <text y="104" class="out show" style="--t:2.3s"><tspan class="k2">▸</tspan> Learning more <tspan class="k2">Rust</tspan>, and poking at Bitcoin, cryptography and wallets on the side.</text>
    <text y="136" class="out show" style="--t:2.7s"><tspan class="k3">▸</tspan> Terminal ricer. My <tspan class="k3">Ghostty</tspan> setup has its own repo, ghost included.</text>
    <text y="168" class="out show" style="--t:3.1s"><tspan class="k4">▸</tspan> Based somewhere in the <tspan class="k4">Milky Way</tspan>. Timezone: whenever the build is green.</text>

    <!-- $ ls ~/voyages -->
    <g class="show" style="--t:3.6s">
      <text y="222"><tspan class="p">root@luffy</tspan><tspan class="c">:</tspan><tspan class="h">~</tspan><tspan class="c">$ </tspan></text>
    </g>
    <text x="166" y="222" class="cmd type" style="--t:3.8s;--d:.7s;--n:13">ls ~/voyages</text>
    <text y="258" class="show" style="--t:4.7s"><tspan class="dir">AgentGate/</tspan><tspan class="out">    </tspan><tspan class="dir" style="fill:#f472b6">UpsideDown/</tspan><tspan class="out">    </tspan><tspan class="dir" style="fill:#a78bfa">ghosTTY-configs/</tspan><tspan class="out">    </tspan><tspan class="dir" style="fill:#38bdf8">Cloudnest.dev/</tspan></text>

    <!-- idle prompt -->
    <g class="show" style="--t:5.2s">
      <text y="296"><tspan class="p">root@luffy</tspan><tspan class="c">:</tspan><tspan class="h">~</tspan><tspan class="c">$ </tspan></text>
    </g>
    <rect x="168" y="279" width="11" height="22" fill="#e2e8f0" class="cursor" style="--t:5.3s"/>
  </g>
</svg>
