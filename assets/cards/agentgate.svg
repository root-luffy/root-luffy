<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="580" height="210" role="img" aria-label="AgentGate: The security checkpoint between AI agents and their MCP tools. Deny by default.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-580" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".5" stop-color="#34d399" stop-opacity=".95"/>
      <stop offset=".75" stop-color="#0ea5e9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1160 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#34d399" stop-opacity=".18"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .in { opacity: 0; animation: in .6s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="#0d1224"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="none" stroke="#222c4d" stroke-width="2"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="none" stroke="url(#sweep)" stroke-width="2.5"/>

  <g class="pulse"><rect x="28" y="28" width="56" height="56" rx="14" fill="url(#acc)"/>
  <text x="56" y="67" text-anchor="middle" font-size="28" font-weight="800" fill="#0d1224">⛨</text></g>
  <text x="104" y="54" font-size="26" font-weight="800" fill="#f1f5f9">AgentGate</text>
  <text x="104" y="78" font-size="14" fill="#7c86a8">github.com/root-luffy/AgentGate</text>

  <g transform="translate(436 18)">
    <path d="M6 30 H44 M6 60 H44 M76 45 H114" stroke="#26304f" stroke-width="2"/>
    <rect x="48" y="12" width="8" height="66" rx="3" fill="#34d399"/>
    <rect x="64" y="12" width="8" height="66" rx="3" fill="#34d399"/>
    <path d="M46 14 Q60 -2 74 14" fill="none" stroke="#34d399" stroke-width="4"/>
    <circle r="4" fill="#34d399"><animateMotion dur="2.4s" repeatCount="indefinite" path="M6 30 H44 L60 45 H114"/></circle>
    <circle r="4" fill="#f87171">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear" path="M6 60 H42"/>
    </circle>
    <text x="60" y="89" text-anchor="middle" font-size="10" fill="#f87171" font-family="Consolas, monospace">403</text></g>

  <text x="28" y="130" font-size="17" fill="#cbd5e1" class="in" style="animation-delay:.2s">The security checkpoint between AI agents</text>
  <text x="28" y="154" font-size="17" fill="#cbd5e1" class="in" style="animation-delay:.35s">and their MCP tools. Deny by default.</text>
  <circle cx="34" cy="186" r="6" fill="#dea584"/>
  <text x="46" y="191" font-size="14" fill="#94a3b8">Rust + TypeScript</text>
  <text x="552" y="191" text-anchor="end" font-size="14" fill="#7c86a8">Rust · Axum · Next.js · Postgres</text>
</svg>
