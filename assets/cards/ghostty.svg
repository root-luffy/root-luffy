<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="580" height="210" role="img" aria-label="ghosTTY-configs: A real wallpaper behind your terminal that rotates on its own and never fights the text.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-580" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".95"/>
      <stop offset=".75" stop-color="#f472b6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1160 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .in { opacity: 0; animation: in .6s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="#0d1224"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="none" stroke="#222c4d" stroke-width="2"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="none" stroke="url(#sweep)" stroke-width="2.5"/>

  <g class="pulse"><rect x="28" y="28" width="56" height="56" rx="14" fill="url(#acc)"/>
  <text x="56" y="67" text-anchor="middle" font-size="28" font-weight="800" fill="#0d1224">👻</text></g>
  <text x="104" y="54" font-size="26" font-weight="800" fill="#f1f5f9">ghosTTY-configs</text>
  <text x="104" y="78" font-size="14" fill="#7c86a8">github.com/root-luffy/ghosTTY-configs</text>

  <g transform="translate(436 18)">
    <rect x="4" y="8" width="112" height="74" rx="8" fill="#0b0c1a" stroke="#26304f" stroke-width="2"/>
    <text x="14" y="36" font-size="13" fill="#a78bfa" font-family="Consolas, monospace">~ ❯</text>
    <rect x="44" y="25" width="8" height="14" fill="#e2e8f0"><animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect>
    <g>
      <path d="M78 70 V50 a14 14 0 0 1 28 0 V70 l-4.7 -5 -4.7 5 -4.7 -5 -4.7 5 -4.6 -5 z" fill="#e0e7ff"/>
      <circle cx="87" cy="52" r="2.6" fill="#0b0c1a"/><circle cx="97" cy="52" r="2.6" fill="#0b0c1a"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.6s" repeatCount="indefinite"/>
    </g></g>

  <text x="28" y="130" font-size="17" fill="#cbd5e1" class="in" style="animation-delay:.2s">A real wallpaper behind your terminal that</text>
  <text x="28" y="154" font-size="17" fill="#cbd5e1" class="in" style="animation-delay:.35s">rotates on its own and never fights the text.</text>
  <circle cx="34" cy="186" r="6" fill="#89e051"/>
  <text x="46" y="191" font-size="14" fill="#94a3b8">Shell</text>
  <text x="552" y="191" text-anchor="end" font-size="14" fill="#7c86a8">Ghostty · Bash · Linux + macOS</text>
</svg>
