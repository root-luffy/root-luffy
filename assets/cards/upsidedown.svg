<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="580" height="210" role="img" aria-label="UpsideDown: Flip your monitor between two computers with one hotkey. No KVM switch needed.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-580" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".95"/>
      <stop offset=".75" stop-color="#f472b6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1160 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .in { opacity: 0; animation: in .6s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    </style>
  </defs>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="#0d1224"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="none" stroke="#222c4d" stroke-width="2"/>
  <rect x="1" y="1" width="578" height="208" rx="18" fill="none" stroke="url(#sweep)" stroke-width="2.5"/>

  <g class="pulse"><rect x="28" y="28" width="56" height="56" rx="14" fill="url(#acc)"/>
  <text x="56" y="67" text-anchor="middle" font-size="28" font-weight="800" fill="#0d1224">⇅</text></g>
  <text x="104" y="54" font-size="26" font-weight="800" fill="#f1f5f9">UpsideDown</text>
  <text x="104" y="78" font-size="14" fill="#7c86a8">github.com/root-luffy/UpsideDown</text>

  <g transform="translate(436 18)">
    <g transform="translate(60 45)">
      <rect x="-40" y="-30" width="80" height="54" rx="6" fill="#0b0c1a" stroke="#4b4d7a" stroke-width="2"/>
      <g>
        <rect x="-35" y="-25" width="70" height="44" rx="3" fill="#22d3ee">
          <animate attributeName="fill" values="#22d3ee;#22d3ee;#f472b6;#f472b6;#22d3ee" keyTimes="0;.45;.5;.95;1" dur="4s" repeatCount="indefinite"/>
        </rect>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0;1 1;1 1;1 0;1 1" keyTimes="0;.4;.45;.5;.9;.95;1" dur="4s" repeatCount="indefinite"/>
      </g>
      <rect x="-8" y="24" width="16" height="8" fill="#2a2b4d"/>
      <rect x="-18" y="32" width="36" height="4" rx="2" fill="#2a2b4d"/>
    </g></g>

  <text x="28" y="130" font-size="17" fill="#cbd5e1" class="in" style="animation-delay:.2s">Flip your monitor between two computers</text>
  <text x="28" y="154" font-size="17" fill="#cbd5e1" class="in" style="animation-delay:.35s">with one hotkey. No KVM switch needed.</text>
  <circle cx="34" cy="186" r="6" fill="#5391fe"/>
  <text x="46" y="191" font-size="14" fill="#94a3b8">PowerShell</text>
  <text x="552" y="191" text-anchor="end" font-size="14" fill="#7c86a8">Windows · DDC/CI · AutoHotkey</text>
</svg>
